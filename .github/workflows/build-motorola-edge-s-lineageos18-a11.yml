name: Build Motorola Edge S / Moto G100 (LineageOS 18.1 A11)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  # Motorola Edge S (CN) = Moto G100 (global) = nio / XT2125，平台 kona(sm8250)
  DEVICE_NAME : "motorola_edge_s"
  DEVICE_CODENAME : "nio"

  # 内核 4.19.157 + vendor/lineageos_nio_defconfig（savedefconfig 形式，本身即完整配置）
  # CROSS_COMPILE 由 found_gcc.sh 自动探测，clang 的 --target 也是从它推出来的
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld LLVM=1"

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_motorola_sm8250.git"
  KERNEL_BRANCH : "lineage-18.1"

  # LOS 19.1/20 用的就是这颗 r416183b，对 kona 4.19 的 LTO/SCS 支持最完整
  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/lineageos_nio_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk , next, bakasu and sukisu

  # 开 SUSFS 后 patch-no-kprobe 会**强制**改走 susfs_inline_hook_patches.sh，
  # HOOK_METHOD 的值在这个模式下被忽略（保留 syscall 只是保持与其它设备一致）。
  # 仓库里的 susfs_patch_to_4.19.patch 实际是 v2.3.0，正好满足 inline hook 的 2.3.00+ 要求。
  SUSFS_ENABLE : true
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos18.1_a11"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "" # 仅在 SUSFS_FIXED=true 时使用 -> [your_name]/[your_patch]
  PATCHES_BRANCH: "" # -> [your_branch]

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "true" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "true" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Motorola Edge S / Moto G100 (LineageOS 18.1 A11)
    runs-on: ubuntu-22.04 # 4.19 老树，22.04 的 glibc / openssl 组合对老内核 host 工具最省事
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🔧 Unblock BakaSU SUSFS build
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"

          # drivers/kernelsu 是指向 KernelSU/kernel 的软链接，直接对链接路径 sed -i
          # 会把链接替换成普通文件（GNU sed 的已知行为），必须先解析出真实目录。
          REAL=$(readlink -f drivers/kernelsu 2>/dev/null)
          [ -n "$REAL" ] || REAL="KernelSU/kernel"
          KB="$REAL/Kbuild"
          echo "[+] KSU kernel dir: $REAL"

          # BakaSU main（日志里是 v4.2.0-rc3）在 CONFIG_KSU_SUSFS=y 时会无条件
          # include tools/susfs_compat.mk，而那个文件整个内容就是一句
          #   $(info ... susfs has NOT update with latest KernelSU source)
          #   $(error Please wait susfs update.)
          # 等于把 SUSFS 编译整个禁掉，属于上游等 simonpunk 更新的占位符。
          # 上一行 inline_hook_check.mk 已经把 ksu_handle_setresuid / execveat /
          # faccessat / sys_read / stat / sys_reboot / input_handle_event 全部找到，
          # 说明内核侧集成是完整的，这里只摘掉这个占位报错。
          if [ -f "$KB" ] && grep -q 'susfs_compat\.mk' "$KB"; then
            sed -i '/susfs_compat\.mk/ s/^/#/' "$KB"
            echo "[+] disabled BakaSU susfs_compat kill-switch:"
            grep -n 'susfs_compat' "$KB"
          else
            echo "[-] susfs_compat.mk include not found (already fixed upstream?), skipped."
          fi

      - name: 🧩 Normalise fs/notify/fdinfo.c for SUSFS
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          python3 - <<'PY'
          import re, sys

          p = 'fs/notify/fdinfo.c'
          s = open(p, encoding='utf-8').read()

          # 1) 补丁只调用 inotify_mark_user_mask() 却从没定义过（4.14/4.19/5.4 三个
          #    补丁都缺），这里按 4.19 原生语义补上：mark->mask & IN_ALL_EVENTS。
          helper = (
              '#ifdef CONFIG_KSU_SUSFS\n'
              'static inline unsigned int inotify_mark_user_mask(struct fsnotify_mark *mark)\n'
              '{\n'
              '\treturn mark->mask & IN_ALL_EVENTS;\n'
              '}\n'
              '#endif\n'
              '\n'
          )
          if 'inotify_mark_user_mask(struct fsnotify_mark *mark)' not in s:
              anchor = '#ifdef CONFIG_INOTIFY_USER\n'
              if anchor not in s:
                  sys.exit('[-] anchor "#ifdef CONFIG_INOTIFY_USER" not found')
              s = s.replace(anchor, helper + anchor, 1)

          # 2) 把 inotify_fdinfo() 里 4.19 老写法的 seq_printf 规范化成补丁期望的形式，
          #    否则 hunk @@ -83,6 +106,60 @@ 的尾随上下文对不上，会落 .rej。
          i = s.index('inotify_fdinfo(struct seq_file')
          j = s.index('inotify_show_fdinfo')
          seg = s[i:j]

          seg = re.sub(r'\t\t/\*.*?\*/\n', '', seg, count=1, flags=re.S)
          seg = re.sub(r'\t\tu32 mask = mark->mask & IN_ALL_EVENTS;\n', '', seg, count=1)
          seg = seg.replace('ignored_mask:%x "', 'ignored_mask:0 "', 1)
          seg = seg.replace('mask, mark->ignored_mask);', 'inotify_mark_user_mask(mark));', 1)

          if 'ignored_mask:0 ' not in seg or 'inotify_mark_user_mask(mark)' not in seg:
              sys.exit('[-] inotify_fdinfo body did not normalise, aborting')

          s = s[:i] + seg + s[j:]
          open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('[+] fdinfo.c normalised for SUSFS patch')
          PY
          grep -n "inotify_mark_user_mask\|ignored_mask:0" fs/notify/fdinfo.c

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          DEFCONFIG=arch/arm64/configs/${DEFCONFIG_NAME}

          # 1) LOCALVERSION 必须保持 "-lineageos"：ROM 里 /vendor/lib/modules 的 .ko
          #    是按 4.19.157-lineageos 编的，vermagic 一变这些模块全都加载不上。
          grep -q '^CONFIG_LOCALVERSION="-lineageos"' "$DEFCONFIG" || echo 'CONFIG_LOCALVERSION="-lineageos"' >> "$DEFCONFIG"

          # 2) 关掉模块签名强制校验。
          #    defconfig 默认 CONFIG_MODULE_SIG_FORCE=y，而新编的内核带的是本次构建
          #    新生成的签名密钥，ROM 里那批 .ko 是 ROM 构建时签的，强制校验会让
          #    音频(wcd938x)/WLAN(qca6390) 等模块全部加载失败。
          sed -i -e 's/^CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' "$DEFCONFIG"
          grep -q '^# CONFIG_MODULE_SIG_FORCE is not set' "$DEFCONFIG" || echo '# CONFIG_MODULE_SIG_FORCE is not set' >> "$DEFCONFIG"

          # 3) -Werror：上一次构建失败的唯一原因就是它。
          #    元凶不是 CONFIG_CC_WERROR（这棵树的 defconfig 里压根没有这个符号），
          #    而是 Makefile 顶部那行无条件的：
          #        KBUILD_CFLAGS := -Wall -Wundef -Werror=strict-prototypes ...
          #    clang 会把它渲染成 [-Werror,-Wstrict-prototypes]，
          #    于是 techpack/camera/.../cam_sensor_core.c:681 的
          #    `int cam_pmic_workaround() {` 老式函数定义直接中断整个构建。
          #    做法：把所有 -Werror=xxx 降级为 -Wno-error=xxx（警告照常打印，
          #    只是不再当错误），再摘掉全局 -Werror，最后在 Makefile 末尾兜底。
          sed -i 's/-Werror=/-Wno-error=/g' Makefile
          sed -i 's/^\(KBUILD_CFLAGS[[:space:]]*+=[[:space:]]*\)-Werror$/\1# -Werror disabled by NonGKI/' Makefile
          [ -z "$(tail -c 1 Makefile)" ] || echo >> Makefile
          grep -q '^KBUILD_CFLAGS += -Wno-error$' Makefile || printf 'KBUILD_CFLAGS += -Wno-error\n' >> Makefile

          # 双保险：把日志里那一处老式函数定义补成 (void) 原型
          CAM_SENSOR_CORE=techpack/camera/drivers/cam_sensor_module/cam_sensor/cam_sensor_core.c
          if [ -f "$CAM_SENSOR_CORE" ]; then
            sed -i 's/int cam_pmic_workaround() {/int cam_pmic_workaround(void) {/' "$CAM_SENSOR_CORE"
            grep -n 'cam_pmic_workaround' "$CAM_SENSOR_CORE" | head -n 3
          fi

          echo "[+] -Werror downgraded:"
          grep -n -- 'Wno-error\|Werror disabled' Makefile | head -n 8

          # 4) 去掉 DEBUG_INFO：4.19 + LTO 全量调试信息产物 10G+，对运行没有任何影响
          sed -i -e 's/^CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/' "$DEFCONFIG"

          # 5) KernelSU 依赖
          grep -q '^CONFIG_KALLSYMS=y' "$DEFCONFIG" || echo 'CONFIG_KALLSYMS=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_KALLSYMS_ALL=y' "$DEFCONFIG" || echo 'CONFIG_KALLSYMS_ALL=y' >> "$DEFCONFIG"

          echo "[+] defconfig prepared:"
          grep -nE 'LOCALVERSION|MODULE_SIG|CC_WERROR|CONFIG_DEBUG_INFO|KALLSYMS|CONFIG_KSU' "$DEFCONFIG" | tail -n 25

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🩹 Fix arm64 CPU hotplug panic (rodata ftr_reg write)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          F=arch/arm64/kernel/cpufeature.c

          # 症状（ramoops 实测，两次复现 PC 与偏移完全一致）：
          #   Unable to handle kernel write to read-only memory at virtual address ...6fa78
          #   pc : check_update_ftr_reg+0xa4/0x15c
          #   lr : update_cpu_features+0x124/0x498
          #   Call trace: check_update_ftr_reg -> cpuinfo_store_cpu -> secondary_start_kernel
          #   触发点：suspend 时 "Disabling non-boot CPUs"，唤醒时 "Enabling non-boot CPUs"；
          #           或手动 echo 1 > /sys/devices/system/cpu/cpuN/online
          #
          # 成因：本 SoC 异构（cpu0-3 part 0x805，cpu4-7 part 0xD0D），CTR_EL0 等字段
          #   大/小核本来就不同。开机时 arm64_ftr_safe_value() 把 arm64_ftr_regs[] 的
          #   sys_val 改成“安全值”，此后 sys_val 不再等于任何一颗核的原始值，于是之后
          #   每次有 CPU 上线，update_cpu_ftr_reg() 都会重新执行一次
          #   `reg->sys_val = arm64_ftr_set_value(...)`。
          #   开机阶段 smp_init() 早于 mark_readonly()，写入能成功；
          #   唤醒时热插拔晚于 mark_readonly()，rodata 已只读 → permission fault → panic。
          #
          # 两层修法互为保险：
          #   A) 这个 store 写进去的值其实和原值相同（幂等），改成只在真正变化时才写。
          #      与原来逐位等价，只是省掉无意义的 store —— 热插拔时彻底不写。
          #   B) 去掉 arm64_ftr_regs[] 的 const。Clang 12 会把 const 数组里的复合字面量
          #      放进 .data.rel.ro，mark_rodata_ro() 后锁成只读；去掉 const 让它在万一
          #      真的需要写的时候也是可写的。
          #
          # 不要改成“跳过净化”：setup_cpu_features()（置 sys_caps_initialised）在
          #   smp_init() 之前就执行完，跳过会让 A55 用上 A77 的缓存行参数，有数据损坏风险。

          grep -q 'update_cpu_ftr_reg' "$F" || { echo "[-] $F: update_cpu_ftr_reg not found, aborting"; exit 1; }

          # ---- A) 只在 sys_val 真正变化时才写 ----
          python3 - "$F" <<'PY'
          import io, re, sys

          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()

          if 'sys_new' in s:
              print('[+] A already applied, skipped')
              sys.exit(0)

          pat = re.compile(
              r'([ \t]*)reg->sys_val = arm64_ftr_set_value\(ftrp, reg->sys_val, ftr_new\);[ \t]*\n')
          m = pat.search(s)
          if not m:
              sys.exit('[-] A: update_cpu_ftr_reg store line not found, aborting')

          ind = m.group(1)
          new = (
              ind + '/*\n'
              + ind + ' * arm64_ftr_regs[] is write-protected once the kernel is fully up,\n'
              + ind + ' * so a store that writes back the very same value faults on CPU\n'
              + ind + ' * hotplug.  Only store when the sanitised value really changes.\n'
              + ind + ' */\n'
              + ind + '{\n'
              + ind + '\tu64 sys_new = arm64_ftr_set_value(ftrp, reg->sys_val, ftr_new);\n'
              + '\n'
              + ind + '\tif (sys_new != reg->sys_val)\n'
              + ind + '\t\treg->sys_val = sys_new;\n'
              + ind + '}\n'
          )

          s = s[:m.start()] + new + s[m.end():]
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
          print('[+] A applied: skip redundant sys_val stores')
          PY

          # ---- B) 让这块存储在需要真写时也是可写的 ----
          if grep -q '^static const struct __ftr_reg_entry {' "$F"; then
            sed -i 's/^static const struct __ftr_reg_entry {/static struct __ftr_reg_entry {/' "$F"
            echo "[+] B applied: dropped 'const' from arm64_ftr_regs[]"
          elif grep -q '^static struct __ftr_reg_entry {' "$F"; then
            echo "[+] B already applied, skipped"
          else
            echo "[-] B: unexpected arm64_ftr_regs declaration, aborting:"
            grep -n '__ftr_reg_entry' "$F"
            exit 1
          fi

          echo "[+] verification:"
          grep -n '^static .*struct __ftr_reg_entry' "$F"
          grep -n 'sys_new' "$F"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ✅ Verify build output
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          IMAGE_DIR=out/arch/arm64/boot

          # 该 defconfig 没开 KERNEL_COMPRESSION_GZIP / APPENDED_DTB_IMAGE，产物是裸 Image
          ls -lh $IMAGE_DIR/Image* 2>/dev/null || true
          if [ -s "$IMAGE_DIR/Image" ] || [ -s "$IMAGE_DIR/Image.gz" ] || [ -s "$IMAGE_DIR/Image.gz-dtb" ]; then
            echo "[+] kernel image ok."
          else
            echo "[-] No kernel image generated."
            exit 1
          fi

          echo "[+] kona dtb / nio dtbo:"
          find $IMAGE_DIR/dts/vendor/qcom -maxdepth 1 \( -name 'kona-moto-base*.dtb' -o -name 'kona-nio-*.dtbo' \) 2>/dev/null | sort

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
