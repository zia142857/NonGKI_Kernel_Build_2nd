name: Build Motorola EDGE S (MYUI A12) - Clean Kernel Test

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_motorola_sm8250.git"
  KERNEL_BRANCH: "lineage-23.2"

  CLANG_SOURCE: "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r574158-14475230/clang-r574158.tar.gz"

  GCC_64_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH: "android12L-release"
  GCC_32_SOURCE: "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH: "android12L-release"

jobs:
  build-kernel:
    name: Clean Kernel - Motorola edge s
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            gcc git libssl-dev libelf-dev lz4 \
            python3 zip device-tree-compiler

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} device_kernel

      - name: 🔧 Download Clang
        run: |
          mkdir -p clang
          curl -L "${{ env.CLANG_SOURCE }}" | tar -xz -C clang

      - name: 🔧 Download GCC
        run: |
          git clone --depth=1 -b ${{ env.GCC_64_BRANCH }} ${{ env.GCC_64_SOURCE }} gcc-64
          git clone --depth=1 -b ${{ env.GCC_32_BRANCH }} ${{ env.GCC_32_SOURCE }} gcc-32

      - name: 🏗️ Build kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export CROSS_COMPILE=$(pwd)/gcc-64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/gcc-32/bin/arm-linux-androideabi-

          cd device_kernel

          make O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=/usr/bin/dtc \
            DTC=/usr/bin/dtc \
            vendor/kona-perf_defconfig

          scripts/kconfig/merge_config.sh -O out/ -m out/.config \
            arch/arm64/configs/vendor/ext_config/moto-kona.config \
            arch/arm64/configs/vendor/ext_config/nio-default.config

          scripts/config --file out/.config --enable CONFIG_PSTORE
          scripts/config --file out/.config --enable CONFIG_PSTORE_CONSOLE
          scripts/config --file out/.config --enable CONFIG_PSTORE_RAM

          make O=out ARCH=arm64 olddefconfig \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=/usr/bin/dtc \
            DTC=/usr/bin/dtc

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=/usr/bin/dtc \
            DTC=/usr/bin/dtc

      - name: ✏️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nio-clean_test-kernel
          path: device_kernel/out/arch/arm64/boot/Image
