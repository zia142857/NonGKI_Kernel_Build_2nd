name: Build Motorola Edge S Non-GKI KernelSU

on:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME: "motorola-edge-s"
  DEVICE_CODENAME: "nio"

  CUSTOM_CMDS: "LLVM=1 LLVM_IAS=1"
  EXTRA_CMDS: "LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

  KERNEL_SOURCE: "https://github.com/LineageOS/android_kernel_motorola_sm8250.git"
  KERNEL_BRANCH: "lineage-23.2"

  # AOSP Gitiles archive of clang-r547379. This uses the template's native
  # tar.gz clang path and avoids cloning the entire clang prebuilts repo.
  CLANG_SOURCE: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android16-release/clang-r547379.tar.gz"
  CLANG_BRANCH: ""

  GCC_GNU: "false"
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/kona-perf_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: "false"

  KERNELSU_SOURCE: ""
  KERNELSU_BRANCH: ""
  KERNELSU_AUTO_GET: "true"
  KERNELSU_AUTO_FORK: "xxksu"
  KERNELSU_METHOD: "shell"

  SUSFS_ENABLE: "false"
  SUSFS_FIXED: "false"

  AK3_SOURCE: "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH: "master"

  BOOT_SOURCE: ""

  NEED_DTBO: "false"
  NEED_SAFE_DTBO: "false"

  ROM_TEXT: "lineage-23.2-a16-ksu"

  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Build_2nd"
  PATCHES_BRANCH: "mainline"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/ext_config/moto-kona.config,vendor/ext_config/nio-default.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Extra Kernel Options
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          python3 - <<'PY'
          from pathlib import Path

          pack_process = Path(".github/workflows/pack-process/action.yml")
          lines = pack_process.read_text(encoding="utf-8").splitlines()
          needle = "          cp -rp ./Anykernel3/* tmp"
          if needle not in lines:
              raise SystemExit("Could not locate AnyKernel3 copy line in pack-process")
          insert_at = lines.index(needle) + 1
          insert = [
              "          cat > tmp/anykernel.sh <<'EOF_AK3'",
              "          ### AnyKernel3 Ramdisk Mod Script",
              "          ## osm0sis @ xda-developers",
              "          ",
              "          properties() { '",
              "          kernel.string=LineageOS 23.2 nio KernelSU kernel",
              "          do.devicecheck=1",
              "          do.modules=0",
              "          do.systemless=1",
              "          do.cleanup=1",
              "          do.cleanuponabort=0",
              "          device.name1=nio",
              "          device.name2=nio_retcn",
              "          device.name3=nio_retail",
              "          device.name4=nio_retus",
              "          device.name5=nio_reteu",
              "          device.name6=nio_global",
              "          device.name7=nio_amz",
              "          supported.versions=",
              "          supported.patchlevels=",
              "          supported.vendorpatchlevels=",
              "          '; }",
              "          ",
              "          BLOCK=boot;",
              "          IS_SLOT_DEVICE=1;",
              "          RAMDISK_COMPRESSION=auto;",
              "          PATCH_VBMETA_FLAG=auto;",
              "          ",
              "          . tools/ak3-core.sh;",
              "          ",
              "          split_boot;",
              "          flash_boot;",
              "          EOF_AK3",
              "          test -s \"$IMAGE_DIR/Image\"",
              "          grep -q \"CONFIG_KSU=y\" out/.config",
              "          {",
              "            echo \"Kernel source:\"",
              "            git log -1 --oneline || true",
              "            echo",
              "            echo \"KernelSU source:\"",
              "            for ksu_dir in KernelSU KernelSU-Next SukiSU-Ultra ReSukiSU; do",
              "              if [ -d \"$ksu_dir/.git\" ]; then",
              "                echo \"$ksu_dir:\"",
              "                git -C \"$ksu_dir\" describe --tags --always --dirty || true",
              "                git -C \"$ksu_dir\" log -1 --oneline || true",
              "              fi",
              "            done",
              "            echo",
              "            echo \"Clang:\"",
              "            \"$GITHUB_WORKSPACE/clang-custom/bin/clang\" --version | head -n1",
              "            echo",
              "            echo \"Enabled config:\"",
              "            grep -E \"CONFIG_KSU=|CONFIG_KSU_|CONFIG_OVERLAY_FS=|CONFIG_KPROBES=|CONFIG_HAVE_KPROBES=\" out/.config || true",
              "            echo",
              "            echo \"Image:\"",
              "            ls -lh \"$IMAGE_DIR/Image\"",
              "          } > tmp/build-info.txt",
          ]
          lines[insert_at:insert_at] = insert
          pack_process.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: Build Process
        uses: ./.github/workflows/build-process

      - name: Pack Process
        uses: ./.github/workflows/pack-process

      - name: Upload Artifacts
        uses: ./.github/workflows/upload-files
