name: Build Motorola Edge S KernelSU Next kernel

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository
        required: true
        default: LineageOS/android_kernel_motorola_sm8250
      kernel_branch:
        description: Kernel branch
        required: true
        default: lineage-23.2
      clang_branch:
        description: Android clang branch
        required: true
        default: android16-release
      clang_version:
        description: Android clang directory to use
        required: true
        default: clang-r547379
      ksu_repo:
        description: KernelSU Next repository
        required: true
        default: KernelSU-Next/KernelSU-Next
      ksu_ref:
        description: KernelSU Next ref for non-GKI kernels
        required: true
        default: v1.1.1
      enable_ksu:
        description: Enable KernelSU Next
        required: true
        type: boolean
        default: true
      hook_mode:
        description: KernelSU Next hook mode
        required: true
        type: choice
        default: kprobe
        options:
          - kprobe
          - manual

permissions:
  contents: read

concurrency:
  group: nio-ksunext-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KernelSU Next AnyKernel3 zip
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}/kernel/motorola/sm8250
      OUT_DIR: ${{ github.workspace }}/out
      CLANG_DIR: ${{ github.workspace }}/toolchains/clang
      CLANG_VERSION: ${{ inputs.clang_version }}
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3
      DEFCONFIG: vendor/kona-perf_defconfig
      CONFIG_FRAGMENTS: vendor/ext_config/moto-kona.config vendor/ext_config/nio-default.config

    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Prepare packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            python3 \
            zip

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch "${{ inputs.kernel_branch }}" \
            "https://github.com/${{ inputs.kernel_repo }}.git" \
            "${KERNEL_DIR}"

      - name: Clone Android clang
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            --branch "${{ inputs.clang_branch }}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${CLANG_DIR}"
          git -C "${CLANG_DIR}" sparse-checkout init --cone
          git -C "${CLANG_DIR}" sparse-checkout set "${CLANG_VERSION}"
          git -C "${CLANG_DIR}" checkout

      - name: Select clang
        run: |
          set -euo pipefail
          PREFERRED_CLANG="${CLANG_DIR}/${CLANG_VERSION}"
          if [ ! -x "${PREFERRED_CLANG}/bin/clang" ]; then
            echo "No usable Android clang found at ${PREFERRED_CLANG}" >&2
            exit 1
          fi
          echo "CLANG_PREBUILT=${PREFERRED_CLANG}" >> "${GITHUB_ENV}"
          "${PREFERRED_CLANG}/bin/clang" --version

      - name: Integrate KernelSU Next
        if: inputs.enable_ksu
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          git clone "https://github.com/${{ inputs.ksu_repo }}.git" KernelSU-Next
          git -C KernelSU-Next checkout "${{ inputs.ksu_ref }}"

          ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          test -f drivers/kernelsu/Kconfig
          git -C KernelSU-Next rev-parse --short HEAD

      - name: Apply KernelSU Next manual syscall hooks
        if: inputs.enable_ksu && inputs.hook_mode == 'manual'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/Patches/syscall_hook_patches.sh" ./

      - name: Backport KernelSU Next path_umount before build
        if: inputs.enable_ksu && inputs.hook_mode == 'manual'
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          if ! grep -Eq '^static int can_umount' fs/namespace.c; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/namespace.c")
          text = path.read_text()
          anchor = "static bool is_mnt_ns_file"
          if anchor not in text:
              raise SystemExit("cannot find namespace.c insertion anchor")

          can_umount = r'''
          static int can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED)
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          '''
          text = text.replace(anchor, can_umount + anchor, 1)
          path.write_text(text)
          PY
          fi

          if ! grep -Eq '^int path_umount' fs/namespace.c; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/namespace.c")
          text = path.read_text()
          anchor = "static bool is_mnt_ns_file"
          if anchor not in text:
              raise SystemExit("cannot find namespace.c insertion anchor")

          path_umount = r'''
          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          '''
          text = text.replace(anchor, path_umount + anchor, 1)
          path.write_text(text)
          PY
          fi

          grep -q '^int path_umount' fs/namespace.c
          grep -q '^static int can_umount' fs/namespace.c

          if ! grep -Eq '^int path_umount\(struct path \*path, int flags\);' fs/internal.h; then
            sed -i '/^extern void __init mnt_init/a int path_umount(struct path *path, int flags);' fs/internal.h
            grep -Eq '^int path_umount\(struct path \*path, int flags\);' fs/internal.h || \
              printf '\nint path_umount(struct path *path, int flags);\n' >> fs/internal.h
          fi

      - name: Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          export PATH="${CLANG_PREBUILT}/bin:${PATH}"

          test -f "arch/arm64/configs/${DEFCONFIG}"
          for fragment in ${CONFIG_FRAGMENTS}; do
            test -f "arch/arm64/configs/${fragment}"
          done

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            "${DEFCONFIG}"

          cat > "${OUT_DIR}/ksunext.config" <<'EOF'
          CONFIG_OVERLAY_FS=y
          EOF
          sed -i 's/^          //' "${OUT_DIR}/ksunext.config"

          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            cat >> "${OUT_DIR}/ksunext.config" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KRETPROBES=y
          CONFIG_HAVE_SYSCALL_TRACEPOINTS=y
          CONFIG_KSU_KPROBES_HOOK=y
          # CONFIG_KSU_MANUAL_HOOK is not set
          EOF
            sed -i 's/^          //' "${OUT_DIR}/ksunext.config"
          fi

          if [ "${{ inputs.enable_ksu }}" = "true" ] && [ "${{ inputs.hook_mode }}" = "manual" ]; then
            cat >> "${OUT_DIR}/ksunext.config" <<'EOF'
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          EOF
            sed -i 's/^          //' "${OUT_DIR}/ksunext.config"
          fi

          FRAGMENT_PATHS=()
          for fragment in ${CONFIG_FRAGMENTS}; do
            FRAGMENT_PATHS+=("arch/arm64/configs/${fragment}")
          done
          ./scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            "${FRAGMENT_PATHS[@]}" \
            "${OUT_DIR}/ksunext.config"

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig

          grep -q "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y" "${OUT_DIR}/.config"
          grep -q "CONFIG_OVERLAY_FS=y" "${OUT_DIR}/.config"
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            grep -q "CONFIG_KSU=y" "${OUT_DIR}/.config"
            grep -q "CONFIG_KPROBES=y" "${OUT_DIR}/.config"
          fi
          if [ "${{ inputs.enable_ksu }}" = "true" ] && [ "${{ inputs.hook_mode }}" = "manual" ]; then
            grep -q "CONFIG_KSU_MANUAL_HOOK=y" "${OUT_DIR}/.config"
          fi

      - name: Build kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KBUILD_BUILD_USER: lineage
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euo pipefail
          export PATH="${CLANG_PREBUILT}/bin:${PATH}"

          make -j"$(nproc)" O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail

          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifact"
          BUILT_IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            ZIP_NAME="AnyKernel3-nio-lineage-23.2-ksunext-${GITHUB_RUN_NUMBER}.zip"
            KERNEL_LABEL="KernelSU Next"
          else
            ZIP_NAME="AnyKernel3-nio-lineage-23.2-no-ksu-${GITHUB_RUN_NUMBER}.zip"
            KERNEL_LABEL="no KernelSU"
          fi
          mkdir -p "${ARTIFACT_DIR}"

          test -s "${BUILT_IMAGE}"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${ANYKERNEL_DIR}"
          cp "${BUILT_IMAGE}" "${ANYKERNEL_DIR}/Image"

          cat > "${ANYKERNEL_DIR}/anykernel.sh" <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=LineageOS 23.2 nio ${KERNEL_LABEL} kernel
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=nio
          device.name2=nio_retcn
          device.name3=nio_retail
          device.name4=nio_retus
          device.name5=nio_reteu
          device.name6=nio_global
          device.name7=nio_amz
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          {
            echo "Kernel source:"
            git -C "${KERNEL_DIR}" log -1 --oneline
            echo
            if [ "${{ inputs.enable_ksu }}" = "true" ]; then
              echo "KernelSU Next source:"
              git -C "${KERNEL_DIR}/KernelSU-Next" describe --tags --always --dirty
              git -C "${KERNEL_DIR}/KernelSU-Next" log -1 --oneline
            else
              echo "KernelSU Next source: disabled"
            fi
            echo
            echo "Clang:"
            "${CLANG_PREBUILT}/bin/clang" --version | head -n1
            echo
            echo "Enabled config:"
            grep -E "CONFIG_OVERLAY_FS=|CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|CONFIG_KSU_KPROBES_HOOK=|CONFIG_KPROBES=|CONFIG_KRETPROBES=|CONFIG_HAVE_KPROBES=|CONFIG_HAVE_SYSCALL_TRACEPOINTS=|CONFIG_KPROBE_EVENTS=" "${OUT_DIR}/.config" || true
            echo
            echo "Image:"
            ls -lh "${BUILT_IMAGE}"
          } | tee "${ARTIFACT_DIR}/build-info.txt"

          rm -rf "${ANYKERNEL_DIR}/.git" "${ANYKERNEL_DIR}/.github"
          rm -f "${ANYKERNEL_DIR}/README.md" "${ANYKERNEL_DIR}/LICENSE"
          find "${ANYKERNEL_DIR}" -type f -name placeholder -delete

          cd "${ANYKERNEL_DIR}"
          zip -r9 "${ARTIFACT_DIR}/${ZIP_NAME}" .
          test -s "${ARTIFACT_DIR}/${ZIP_NAME}"

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-nio-lineage-23.2-${{ github.run_number }}
          path: |
            artifact/AnyKernel3-nio-lineage-23.2-ksunext-*.zip
            artifact/AnyKernel3-nio-lineage-23.2-no-ksu-*.zip
            artifact/build-info.txt
          if-no-files-found: error
