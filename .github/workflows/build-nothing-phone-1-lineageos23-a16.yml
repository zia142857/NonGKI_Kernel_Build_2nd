name: Build Motorola Edge S kernel Image and AnyKernel3 zip

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: Kernel repository
        required: true
        default: LineageOS/android_kernel_motorola_sm8250
      kernel_branch:
        description: Kernel branch
        required: true
        default: lineage-23.2
      clang_branch:
        description: Android clang branch
        required: true
        default: android16-release
      clang_version:
        description: Android clang directory to use
        required: true
        default: clang-r547379
      enable_ksunext:
        description: Enable KernelSU Next
        required: true
        type: boolean
        default: true
      ksunext_repo:
        description: KernelSU Next repository
        required: true
        default: KernelSU-Next/KernelSU-Next
      ksunext_branch:
        description: KernelSU Next branch or tag
        required: true
        default: next

permissions:
  contents: read

concurrency:
  group: nio-kernel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build kernel Image and AnyKernel3 zip
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}/kernel/motorola/sm8250
      OUT_DIR: ${{ github.workspace }}/out
      CLANG_DIR: ${{ github.workspace }}/toolchains/clang
      CLANG_VERSION: ${{ inputs.clang_version }}
      ANYKERNEL_DIR: ${{ github.workspace }}/AnyKernel3
      DEFCONFIG: vendor/kona-perf_defconfig
      CONFIG_FRAGMENTS: vendor/ext_config/moto-kona.config vendor/ext_config/nio-default.config

    steps:
      - name: Prepare packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            python3 \
            xz-utils \
            zip

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            --branch "${{ inputs.kernel_branch }}" \
            "https://github.com/${{ inputs.kernel_repo }}.git" \
            "${KERNEL_DIR}"

      - name: Clone Android clang
        run: |
          git clone --depth=1 --filter=blob:none --no-checkout \
            --branch "${{ inputs.clang_branch }}" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "${CLANG_DIR}"
          git -C "${CLANG_DIR}" sparse-checkout init --cone
          git -C "${CLANG_DIR}" sparse-checkout set "${CLANG_VERSION}"
          git -C "${CLANG_DIR}" checkout

      - name: Select clang
        run: |
          set -euo pipefail
          PREFERRED_CLANG="${CLANG_DIR}/${CLANG_VERSION}"
          if [ ! -x "${PREFERRED_CLANG}/bin/clang" ]; then
            echo "No usable Android clang found at ${PREFERRED_CLANG}" >&2
            exit 1
          fi
          echo "CLANG_PREBUILT=${PREFERRED_CLANG}" >> "${GITHUB_ENV}"
          "${PREFERRED_CLANG}/bin/clang" --version

      - name: Validate kernel configuration files
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          test -f "arch/arm64/configs/${DEFCONFIG}"
          for fragment in ${CONFIG_FRAGMENTS}; do
            test -f "arch/arm64/configs/${fragment}"
          done

      - name: Add KernelSU Next
        if: ${{ inputs.enable_ksunext }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          SETUP_URL="https://raw.githubusercontent.com/${{ inputs.ksunext_repo }}/${{ inputs.ksunext_branch }}/kernel/setup.sh"
          curl -fLSs "${SETUP_URL}" -o /tmp/ksunext-setup.sh
          bash /tmp/ksunext-setup.sh

          KSU_REPO_DIR=""
          if [ -d KernelSU-Next/.git ]; then
            KSU_REPO_DIR="KernelSU-Next"
          elif [ -d KernelSU/.git ]; then
            KSU_REPO_DIR="KernelSU"
          elif [ -d drivers/kernelsu/.git ]; then
            KSU_REPO_DIR="drivers/kernelsu"
          fi

          if [ -n "${KSU_REPO_DIR}" ]; then
            git -C "${KSU_REPO_DIR}" fetch --depth=1 origin "${{ inputs.ksunext_branch }}"
            git -C "${KSU_REPO_DIR}" checkout --detach FETCH_HEAD
          fi

          if [ -d KernelSU-Next ]; then
            git -C KernelSU-Next log -1 --oneline || true
          elif [ -d KernelSU ]; then
            git -C KernelSU log -1 --oneline || true
          elif [ -d drivers/kernelsu ]; then
            git -C drivers/kernelsu log -1 --oneline || true
          else
            echo "KernelSU Next setup did not create a known source directory" >&2
            exit 1
          fi

      - name: Patch KernelSU Next file wrapper compatibility
        if: ${{ inputs.enable_ksunext }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail

          KSU_FILE="$(
            find -L KernelSU KernelSU-Next drivers/kernelsu \
              -path '*/infra/file_wrapper.c' \
              -type f \
              -print \
              -quit 2>/dev/null || true
          )"
          if [ -z "${KSU_FILE}" ]; then
            echo "KernelSU Next file_wrapper.c was not found" >&2
            exit 1
          fi

          python3 - "${KSU_FILE}" <<'PY'
          import re
          import sys
          from pathlib import Path

          ksu_file = Path(sys.argv[1])
          fs_h = Path("include/linux/fs.h").read_text(errors="ignore")
          text = ksu_file.read_text()
          original = text

          def remove_block(pattern, label, needle):
              global text
              updated, count = re.subn(pattern, "\n", text, count=1, flags=re.S)
              if count == 0 and needle in text:
                  raise SystemExit(f"failed to patch KernelSU Next {label}")
              text = updated

          fops_match = re.search(r"struct\s+file_operations\s*\{(?P<body>.*?)\n\};", fs_h, re.S)
          if not fops_match:
              raise SystemExit("failed to find struct file_operations in include/linux/fs.h")
          fops = fops_match.group("body")

          has_iopoll = re.search(r"\biopoll\b", fops) is not None
          has_remap_file_range = re.search(r"\bremap_file_range\b", fops) is not None

          if not has_iopoll:
              remove_block(
                  r"\n#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6,\s*1,\s*0\)\n"
                  r"static int ksu_wrapper_iopoll\(.*?\n#endif\n"
                  r"(?=\n#if LINUX_VERSION_CODE < KERNEL_VERSION\(6,\s*6,\s*0\))",
                  "iopoll wrapper",
                  "ksu_wrapper_iopoll",
              )
              remove_block(
                  r"\n#if LINUX_VERSION_CODE >= KERNEL_VERSION\(6,\s*1,\s*0\)\n"
                  r"\s*p->ops\.iopoll = .*?\n#endif",
                  "iopoll operation",
                  ".iopoll",
              )

          if not has_remap_file_range:
              remove_block(
                  r"\n#if LINUX_VERSION_CODE >= KERNEL_VERSION\(4,\s*20,\s*0\)\n"
                  r"// no REMAP_FILE_DEDUP:.*?\n#endif\n"
                  r"(?=\n#if LINUX_VERSION_CODE >= KERNEL_VERSION\(4,\s*19,\s*0\))",
                  "remap_file_range wrapper",
                  "ksu_wrapper_remap_file_range",
              )
              remove_block(
                  r"\n#if LINUX_VERSION_CODE >= KERNEL_VERSION\(4,\s*20,\s*0\)\n"
                  r"\s*p->ops\.remap_file_range = .*?\n#endif",
                  "remap_file_range operation",
                  ".remap_file_range",
              )

          if text != original:
              ksu_file.write_text(text)

          print(f"KernelSU Next file wrapper: {ksu_file}")
          print(f"file_operations.iopoll present: {has_iopoll}")
          print(f"file_operations.remap_file_range present: {has_remap_file_range}")
          print(f"patched: {text != original}")
          PY

          if ! grep -qw "iopoll" include/linux/fs.h; then
            ! grep -q "iopoll" "${KSU_FILE}"
          fi
          if ! grep -qw "remap_file_range" include/linux/fs.h; then
            ! grep -q "remap_file_range" "${KSU_FILE}"
          fi

      - name: Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          export PATH="${CLANG_PREBUILT}/bin:${PATH}"

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            "${DEFCONFIG}"

          FRAGMENT_PATHS=()
          for fragment in ${CONFIG_FRAGMENTS}; do
            FRAGMENT_PATHS+=("arch/arm64/configs/${fragment}")
          done

          KSU_FRAGMENT=()
          if [[ "${{ inputs.enable_ksunext }}" == "true" ]]; then
            cat > "${OUT_DIR}/ksunext.config" <<'EOF'
          CONFIG_KPROBES=y
          CONFIG_KSU=y
          EOF
            KSU_FRAGMENT=("${OUT_DIR}/ksunext.config")
          fi

          ./scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" "${FRAGMENT_PATHS[@]}" "${KSU_FRAGMENT[@]}"

          make O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig

          grep -q "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y" "${OUT_DIR}/.config"
          if [[ "${{ inputs.enable_ksunext }}" == "true" ]]; then
            grep -q "CONFIG_KPROBES=y" "${OUT_DIR}/.config"
            grep -q "CONFIG_KSU=y" "${OUT_DIR}/.config"
          fi

      - name: Build Image
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          KBUILD_BUILD_USER: lineage
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -euo pipefail
          export PATH="${CLANG_PREBUILT}/bin:${PATH}"

          make -j"$(nproc)" O="${OUT_DIR}" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image

      - name: Collect Image artifact
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifact"
          mkdir -p "${ARTIFACT_DIR}"

          IMAGE="${OUT_DIR}/arch/arm64/boot/Image"
          test -s "${IMAGE}"
          cp "${IMAGE}" "${ARTIFACT_DIR}/Image"

          {
            echo "Kernel source:"
            git -C "${KERNEL_DIR}" log -1 --oneline
            echo
            if [[ "${{ inputs.enable_ksunext }}" == "true" ]]; then
              echo "KernelSU Next:"
              if [ -d "${KERNEL_DIR}/KernelSU-Next" ]; then
                git -C "${KERNEL_DIR}/KernelSU-Next" log -1 --oneline || true
              elif [ -d "${KERNEL_DIR}/KernelSU" ]; then
                git -C "${KERNEL_DIR}/KernelSU" log -1 --oneline || true
              elif [ -d "${KERNEL_DIR}/drivers/kernelsu" ]; then
                git -C "${KERNEL_DIR}/drivers/kernelsu" log -1 --oneline || true
              else
                echo "enabled, source directory not found"
              fi
              grep -E "CONFIG_KSU=|CONFIG_KPROBES=" "${OUT_DIR}/.config" || true
              echo
            fi
            echo "Clang:"
            "${CLANG_PREBUILT}/bin/clang" --version | head -n1
            echo
            echo "Image:"
            ls -lh "${ARTIFACT_DIR}/Image"
          } | tee "${ARTIFACT_DIR}/build-info.txt"

      - name: Package AnyKernel3 flashable zip
        run: |
          set -euo pipefail

          ARTIFACT_DIR="${GITHUB_WORKSPACE}/artifact"
          BUILT_IMAGE="${ARTIFACT_DIR}/Image"
          ZIP_SUFFIX="lineage-23.2"
          KERNEL_STRING="LineageOS 23.2 nio kernel"
          if [[ "${{ inputs.enable_ksunext }}" == "true" ]]; then
            ZIP_SUFFIX="${ZIP_SUFFIX}-ksunext"
            KERNEL_STRING="${KERNEL_STRING} + KernelSU Next"
          fi
          ZIP_NAME="AnyKernel3-nio-${ZIP_SUFFIX}-${GITHUB_RUN_NUMBER}.zip"

          test -s "${BUILT_IMAGE}"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "${ANYKERNEL_DIR}"

          cp "${BUILT_IMAGE}" "${ANYKERNEL_DIR}/Image"
          cat > "${ANYKERNEL_DIR}/anykernel.sh" <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=${KERNEL_STRING}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=nio
          device.name2=nio_retcn
          device.name3=nio_retail
          device.name4=nio_retus
          device.name5=nio_reteu
          device.name6=nio_global
          device.name7=nio_amz
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          rm -rf "${ANYKERNEL_DIR}/.git" "${ANYKERNEL_DIR}/.github"
          rm -f "${ANYKERNEL_DIR}/README.md" "${ANYKERNEL_DIR}/LICENSE"
          find "${ANYKERNEL_DIR}" -type f -name placeholder -delete

          cd "${ANYKERNEL_DIR}"
          zip -r9 "${ARTIFACT_DIR}/${ZIP_NAME}" .
          test -s "${ARTIFACT_DIR}/${ZIP_NAME}"

          {
            echo
            echo "AnyKernel3 zip:"
            ls -lh "${ARTIFACT_DIR}/${ZIP_NAME}"
          } >> "${ARTIFACT_DIR}/build-info.txt"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-nio-lineage-23.2${{ inputs.enable_ksunext && '-ksunext' || '' }}-${{ github.run_number }}
          path: |
            artifact/AnyKernel3-nio-lineage-23.2-*.zip
            artifact/Image
            artifact/build-info.txt
          if-no-files-found: error
